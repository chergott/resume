# Builds the resume PDF and publishes it as @chergott/resume on GitHub Packages,
# for chergott-site to depend on (see package/).
name: Resume package

on:
  push:
    branches: [main]
    paths:
      - "resume.md"
      - "resume.css"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@chergott"

      - run: npm ci
      - run: npm run build
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Publish
        run: |
          rm -rf package/dist
          cp -r dist package/dist
          cd package
          npm version --no-git-tag-version "0.1.${{ github.run_number }}"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
